<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Alby Arifin</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
        body {background:linear-gradient(135deg,#0f0f1a,#1a1a2e,#16213e);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;}
        .card {background:rgba(255,255,255,.05);padding:50px 35px;border-radius:24px;text-align:center;max-width:400px;width:100%;border:1px solid rgba(233,69,96,.3);box-shadow:0 0 40px rgba(233,69,96,.15);}
        .avatar {width:120px;height:120px;background:linear-gradient(135deg,#e94560,#533483);border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:50px;margin:0 auto 20px;border:3px solid #e94560;}
        h1 {color:#fff;font-size:30px;margin-bottom:5px;}
        .tag {color:#e94560;font-size:16px;margin-bottom:30px;}
        .info {background:rgba(255,255,255,.03);border-radius:12px;padding:15px;margin-bottom:15px;}
        .info p {color:#ccc;font-size:15px;margin:8px 0;}
        .info strong {color:#fff;}
        .links {margin-top:25px;}
        .btn {display:block;background:rgba(233,69,96,.15);color:#e94560;text-decoration:none;padding:12px;border-radius:10px;margin-bottom:10px;font-weight:600;transition:all .3s;}
        .btn:hover {background:#e94560;color:white;}
        .footer {margin-top:30px;font-size:12px;color:#555;}
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">🦅</div>
        <h1>Alby Arifin</h1>
        <p class="tag">@alby_mieayam</p>
        <div class="info">
            <p><strong>Hobi:</strong> Gamers 🎮</p>
            <p><strong>Makanan Favorit:</strong> Mie Ayam 🍜</p>
        </div>
        <div class="links">
            <a href="#" class="btn">📱 WhatsApp</a>
            <a href="#" class="btn">📸 Instagram</a>
            <a href="#" class="btn">🎵 TikTok</a>
        </div>
        <div class="footer">© 2026 Alby Arifin • Dibuat dengan ❤️</div>
    </div>
</body>
</html>
